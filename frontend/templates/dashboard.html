{% extends "base.html" %}
{% block title %}Dashboard · StudyBuddy{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Dashboard</h1>
    <p class="page-lead" id="welcome">Welcome back</p>
  </div>
  <a class="btn btn--secondary" href="{{ url_for('views.profile') }}">Edit profile</a>
</header>

<div class="grid grid--3">
  <section class="card" aria-labelledby="requests-heading">
    <h2 id="requests-heading" class="card__title">Pending requests</h2>
    <ul id="pending-requests" class="list"></ul>
  </section>

  <section class="card" aria-labelledby="matches-heading">
    <h2 id="matches-heading" class="card__title">Top matches</h2>
    <ul id="top-matches" class="list"></ul>
    <div class="card__footer">
      <a class="btn btn--secondary btn--sm" href="{{ url_for('views.matches') }}">See all matches</a>
    </div>
  </section>

  <section class="card" aria-labelledby="groups-heading">
    <h2 id="groups-heading" class="card__title">My groups</h2>
    <ul id="my-groups" class="list"></ul>
    <div class="card__footer">
      <a class="btn btn--secondary btn--sm" href="{{ url_for('views.groups') }}">All groups</a>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/dashboard.js') }}" defer></script>
{% endblock %}
