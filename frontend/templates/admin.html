{% extends "base.html" %}
{% block content %}
<div class="page">
  <h1>Admin Panel</h1>
  <div class="dashboard-grid">
    <div class="card">
      <h3>📊 Statistics</h3>
      <div id="stats"><p>Loading...</p></div>
    </div>
    <div class="card">
      <h3>📚 Manage Subjects</h3>
      <div id="subjectAdmin"></div>
      <div class="add-row">
        <input type="text" id="newSubject" placeholder="New subject name" />
        <button class="btn-primary" onclick="addSubject()">Add</button>
      </div>
    </div>
    <div class="card" style="grid-column: span 2">
      <h3>👥 All Users</h3>
      <div id="userList"><p>Loading...</p></div>
    </div>
  </div>
</div>
<script>
async function loadAdmin() {
  const stats = await fetch('/api/admin/stats').then(r => r.json());
  document.getElementById('stats').innerHTML = `
    <p>👤 Users: <strong>${stats.total_users}</strong></p>
    <p>👥 Groups: <strong>${stats.total_groups}</strong></p>
    <p>🤝 Accepted Matches: <strong>${stats.accepted_matches}</strong></p>`;

  const subs = await fetch('/api/admin/subjects').then(r => r.json());
  document.getElementById('subjectAdmin').innerHTML = subs.subjects.map(s =>
    `<div class="tag-row"><span class="tag">${s.name}</span>
     <button class="btn-xs btn-red" onclick="deleteSubject(${s.id})">✕</button></div>`).join('');

  const users = await fetch('/api/admin/users').then(r => r.json());
  document.getElementById('userList').innerHTML = `
    <table class="data-table">
      <thead><tr><th>ID</th><th>Email</th><th>Name</th><th>Role</th></tr></thead>
      <tbody>${users.users.map(u => `<tr><td>${u.id}</td><td>${u.email}</td><td>${u.display_name}</td><td>${u.role}</td></tr>`).join('')}</tbody>
    </table>`;
}

async function addSubject() {
  const name = document.getElementById('newSubject').value.trim();
  if (!name) return;
  await fetch('/api/admin/subjects', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})});
  document.getElementById('newSubject').value = '';
  loadAdmin();
}

async function deleteSubject(id) {
  await fetch(`/api/admin/subjects/${id}`, {method:'DELETE'});
  loadAdmin();
}

loadAdmin();
</script>
{% endblock %}
