{% extends "base.html" %}
{% block title %}Admin · StudyBuddy{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Admin panel</h1>
    <p class="page-lead">Site statistics, subjects and users.</p>
  </div>
</header>

<div class="grid">
  <section class="card" aria-labelledby="stats-heading">
    <h2 id="stats-heading" class="card__title">Statistics</h2>
    <dl id="stats" class="stat-list"></dl>
  </section>

  <section class="card" aria-labelledby="subjects-heading">
    <h2 id="subjects-heading" class="card__title">Subjects</h2>
    <ul id="subject-admin" class="list"></ul>
    <form id="subject-form" class="form-row">
      <div class="field">
        <label class="field__label" for="new-subject">New subject</label>
        <input id="new-subject" type="text" maxlength="100" required>
      </div>
      <button class="btn btn--primary" type="submit">Add subject</button>
    </form>
    <div id="subject-msg" role="status" hidden></div>
  </section>

  <section class="card span-full" aria-labelledby="users-heading">
    <h2 id="users-heading" class="card__title">All users</h2>
    <table class="data-table">
      <thead>
        <tr><th scope="col">ID</th><th scope="col">Email</th><th scope="col">Name</th><th scope="col">Role</th></tr>
      </thead>
      <tbody id="user-rows"></tbody>
    </table>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/admin.js') }}" defer></script>
{% endblock %}
