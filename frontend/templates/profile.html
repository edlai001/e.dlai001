{% extends "base.html" %}
{% block title %}My profile · StudyBuddy{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">My profile</h1>
    <p class="page-lead">What you study and when you're free decides who you get matched with.</p>
  </div>
</header>

<div class="grid">
  <section class="card" aria-labelledby="info-heading">
    <h2 id="info-heading" class="card__title">Personal info</h2>
    <form id="profile-form" class="form">
      <div class="field">
        <label class="field__label" for="display-name">Display name</label>
        <input id="display-name" type="text" maxlength="100" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label class="field__label" for="major">Major</label>
        <input id="major" type="text" maxlength="100" placeholder="e.g. Computer Science">
      </div>
      <div class="field">
        <label class="field__label" for="bio">Bio</label>
        <textarea id="bio" rows="4" maxlength="1000" placeholder="Tell others about yourself"></textarea>
      </div>
      <div class="field">
        <label class="field__label" for="language">Preferred language</label>
        <select id="language">
          <option>English</option><option>Hungarian</option><option>Mongolian</option>
          <option>German</option><option>French</option><option>Other</option>
        </select>
      </div>
      <div>
        <button class="btn btn--primary" type="submit">Save profile</button>
      </div>
      <div id="profile-msg" role="status" hidden></div>
    </form>
  </section>

  <div class="stack">
    <section class="card" aria-labelledby="subjects-heading">
      <h2 id="subjects-heading" class="card__title">My subjects</h2>
      <ul id="subject-list" class="list"></ul>
      <form id="subject-form" class="form-row">
        <div class="field">
          <label class="field__label" for="subject-select">Subject</label>
          <select id="subject-select"></select>
        </div>
        <div class="field">
          <label class="field__label" for="subject-level">Level</label>
          <select id="subject-level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="subject-goal">Goal</label>
          <select id="subject-goal">
            <option value="exam">Exam prep</option>
            <option value="project">Project</option>
            <option value="general">General</option>
          </select>
        </div>
        <button class="btn btn--primary" type="submit">Add subject</button>
      </form>
      <div id="subject-msg" role="status" hidden></div>
    </section>

    <section class="card" aria-labelledby="availability-heading">
      <h2 id="availability-heading" class="card__title">Weekly availability</h2>
      <ul id="slot-list" class="list"></ul>
      <form id="slot-form" class="form-row">
        <div class="field">
          <label class="field__label" for="slot-day">Day</label>
          <select id="slot-day">
            <option value="0">Monday</option><option value="1">Tuesday</option>
            <option value="2">Wednesday</option><option value="3">Thursday</option>
            <option value="4">Friday</option><option value="5">Saturday</option>
            <option value="6">Sunday</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="slot-start">From</label>
          <input id="slot-start" type="time" value="09:00" required>
        </div>
        <div class="field">
          <label class="field__label" for="slot-end">To</label>
          <input id="slot-end" type="time" value="11:00" required>
        </div>
        <button class="btn btn--primary" type="submit">Add time</button>
      </form>
      <div id="slot-msg" role="status" hidden></div>
    </section>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/profile.js') }}" defer></script>
{% endblock %}
